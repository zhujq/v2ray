name: Scheduled Wake Codespace

on:  
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate and Wake Codespace
        env:
          # 使用拥有 Codespaces 全限的个人访问令牌
          GH_TOKEN: ${{ secrets.CODESPACE_WAKE_TOKEN }}
          # 替换为你在步骤 1 复制的 Codespace 名字
          CODESPACE_NAME: "didactic-eureka-549w5pwv9gw247j4"
        run: |
          echo "正在检测 Codespace 状态..."
          
          # 使用 gh 命令行工具向目标 codespace 发送一条无害的空命令（例如查看机器运行时间）
          # 这会强制激活已经处于 Stop 状态的实例
          gh codespace ssh -c "$CODESPACE_NAME" -- uptime
